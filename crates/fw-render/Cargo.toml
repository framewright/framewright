[package]
name = "fw-render"
description = "Framewright's GPU executor: runs compiled plans on an engine-owned wgpu device"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# The same ash as wgpu-hal, for the raw Vulkan work hardware decoding needs.
ash = "0.38"
fw-compile.workspace = true
fw-core.workspace = true
fw-plugin.workspace = true
bytemuck = "1"
half = { version = "2", features = ["bytemuck"] }
pollster = "0.4"
thiserror.workspace = true
wgpu.workspace = true

[dev-dependencies]
naga.workspace = true
fw-doc.workspace = true
fw-media.workspace = true
fw-ops.workspace = true
fw-testmedia.workspace = true
tempfile.workspace = true
