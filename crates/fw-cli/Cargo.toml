[package]
name = "fw-cli"
description = "Framewright's command-line tool: headless render and inspect"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "fw"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fw-compile.workspace = true
fw-core.workspace = true
fw-doc.workspace = true
fw-media.workspace = true
fw-ops.workspace = true
fw-plugin.workspace = true
fw-render.workspace = true

[dev-dependencies]
fw-testmedia.workspace = true
tempfile.workspace = true
