[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
fw-core = { path = "crates/fw-core" }
fw-plugin = { path = "crates/fw-plugin" }
fw-doc = { path = "crates/fw-doc" }
fw-ops = { path = "crates/fw-ops" }
fw-compile = { path = "crates/fw-compile" }
fw-media = { path = "crates/fw-media" }
fw-audio = { path = "crates/fw-audio" }
fw-playback = { path = "crates/fw-playback" }
fw-engine = { path = "crates/fw-engine" }
fw-testmedia = { path = "crates/fw-testmedia" }
fw-render = { path = "crates/fw-render" }
fw-shader = { path = "crates/fw-shader" }

blake3 = "1"
imbl = { version = "6", features = ["serde"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the default parser can be off by one ulp, which breaks exact round trips.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
tempfile = "3"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
# naga validates generated shaders: shader plugins as they load, and kernels in tests. Keep it on
# the same major as wgpu.
naga = { version = "30", features = ["wgsl-in"] }
toml = "1"
# Development builds link the system FFmpeg (design §12); the private build replaces this later.
rsmpeg = { version = "0.18", default-features = false, features = ["ffmpeg8", "link_system_ffmpeg"] }
# Only fw-render and fw-app may depend on wgpu; it follows egui-wgpu's major version.
wgpu = "30"
# The UI (fw-app): egui driven by hand on our own window and the engine's device.
egui = "0.37"
egui-winit = { version = "0.37", features = ["accesskit", "clipboard", "links", "wayland", "x11"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
egui_tiles = "0.18"
winit = "0.30.13"
